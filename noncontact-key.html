<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>非接触キー — 外部擬似装置</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#252526; --border:#3c3c3c; --fg:#d4d4d4;
    --muted:#858585; --accent:#1177bb; --accent2:#0e639c;
    --tx:#4fc1ff; --rx:#4ec9b0; --info:#858585; --err:#f48771; --warn:#dcdcaa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;font-size:13px}
  header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;margin:0 0 0 8px;font-weight:600}
  header .ver{color:var(--muted);font-size:11px}
  main{padding:14px;display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px}
  .panel h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  label.field{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  select,input[type=text],input[type=number]{background:#1e1e1e;color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:13px;font-family:Consolas,"Courier New",monospace}
  select#port{min-width:240px}
  input.w-narrow{width:80px}
  button{background:var(--accent2);color:#fff;border:none;border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer}
  button:hover{background:var(--accent)}
  button:disabled{background:#3a3a3a;color:#777;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}
  button.ghost:hover{background:#2d2d30}
  .sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:#777}
  .dot.on{background:#4ec9b0;box-shadow:0 0 6px #4ec9b0}
  .tablewrap{max-height:310px;overflow:auto;border:1px solid var(--border);border-radius:4px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border:1px solid var(--border);padding:3px 6px}
  th{background:#2d2d30;color:var(--muted);font-weight:600;position:sticky;top:0}
  td input[type=text],td select{width:100%;font-size:12px;padding:2px 4px}
  .pkt{margin-bottom:6px;border:1px solid var(--border);border-radius:4px;padding:6px;background:#141414}
  .pkt-h{color:var(--warn);font-size:11px;margin-bottom:3px}
  .pkt-hex{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--rx);word-break:break-all}
  .pkt-asc{font-family:Consolas,"Courier New",monospace;font-size:11px;color:#c8c8c8;margin-top:2px}
  #preview:empty::before{content:"（「電文生成」を押すとここにプレビューされます）";color:var(--muted);font-size:11px}
  #log{background:#141414;border:1px solid var(--border);border-radius:4px;height:170px;overflow:auto;padding:8px 10px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.6}
  .le{white-space:pre-wrap;word-break:break-all}
  .le .ts{color:#6a6a6a}
  .le .dir{font-weight:bold;margin:0 6px}
  .le.tx .dir{color:var(--tx)} .le.rx .dir{color:var(--rx)}
  .le.info{color:var(--info)} .le.err{color:var(--err)} .le.warn{color:var(--warn)}
  .spec{font-size:11px;color:var(--muted)}
  code{background:#333;padding:1px 5px;border-radius:3px;font-size:11px}
</style>
</head>
<body>
<header>
  <button class="ghost" onclick="location.href='index.html'">← 通信ターミナル</button>
  <button class="ghost" onclick="location.href='locker4.html'">宅配4線式</button>
  <button class="ghost" onclick="location.href='locker2.html'">宅配2線式</button>
  <h1>非接触キーコントローラ</h1>
  <span class="ver">STX + Mseg + ETX + BCC / ACK・NAK応答対応</span>
  <span class="status" style="margin-left:auto"><span id="dot" class="dot"></span><span id="statusText">未接続</span></span>
</header>

<main>
  <section class="panel">
    <h2>接続</h2>
    <div class="row">
      <label class="field">ポート
        <select id="port"><option value="">（更新を押してください）</option></select>
      </label>
      <button id="btnRefresh" class="ghost">更新</button>
      <div class="sep"></div>
      <label class="field">ボーレート
        <select id="baud">
          <option>1200</option><option>2400</option><option>4800</option>
          <option selected>9600</option><option>19200</option>
        </select>
      </label>
      <button id="btnConnect">接続</button>
      <button id="btnDisconnect" class="ghost" disabled>切断</button>
      <span class="spec">※8bit / Even / Stop1。DashVHX以降の標準は9600bps。</span>
    </div>
  </section>

  <section class="panel">
    <h2>キー読取データ</h2>
    <div class="row">
      <label class="field">表示件数<input type="text" id="count" class="w-narrow" value="5"></label>
      <label class="field">ゲート番号(初期)<input type="text" id="gate" class="w-narrow" value="1"></label>
      <label class="field">棟番号(初期)<input type="text" id="building" class="w-narrow" value="0"></label>
      <label class="field">開始部屋番号<input type="text" id="startRoom" class="w-narrow" value="101"></label>
      <label class="field">開始個人番号<input type="text" id="startPerson" class="w-narrow" value="1"></label>
      <label class="field">データ形式
        <select id="defaultFormat">
          <option value="withPerson" selected>13バイト</option>
          <option value="roomOnly">10バイト</option>
        </select>
      </label>
      <button id="btnBuild" class="ghost">テーブル生成</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnCheckAll" class="ghost">全選択</button>
      <button id="btnUncheckAll" class="ghost">全解除</button>
      <span class="spec">※ルーム番号は「棟1桁 + 部屋4桁」の5桁ASCIIとして送信します。</span>
    </div>
    <div class="tablewrap" style="margin-top:8px">
      <table>
        <thead>
          <tr><th style="width:40px">送信</th><th style="width:40px">No</th><th>ゲート番号</th><th>ルーム番号(5桁)</th><th>個人番号</th><th style="width:210px">形式</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>電文</h2>
    <div class="row">
      <button id="btnGenerate">電文生成（プレビュー）</button>
      <button id="btnSend" disabled>送信</button>
      <div class="sep"></div>
      <label class="field">ACK待ちタイムアウト(ms)<input type="text" id="ackTimeout" class="w-narrow" value="5000"></label>
      <label class="field">NAK/無応答 再送回数<input type="text" id="retryCount" class="w-narrow" value="5"></label>
      <label class="field">応答待ち
        <select id="waitResponse">
          <option value="yes" selected>ACK/NAKを待つ</option>
          <option value="no">待たずに連続送信</option>
        </select>
      </label>
      <label class="field">異常系
        <select id="bccMode">
          <option value="normal" selected>BCC正常</option>
          <option value="bad">BCC誤り注入</option>
        </select>
      </label>
    </div>
    <div id="preview" style="margin-top:10px"></div>
  </section>

  <section class="panel">
    <h2>通信ログ</h2>
    <div class="row" style="margin-bottom:8px">
      <button id="btnClear" class="ghost">クリア</button>
      <span class="spec">ACK=06H / NAK=15H。NAKまたはタイムアウト時は設定回数まで同一電文を再送します。</span>
    </div>
    <div id="log"></div>
  </section>
</main>

<script src="protocol/noncontact-key.js"></script>
<script src="noncontact-key-ui.js"></script>
</body>
</html>
